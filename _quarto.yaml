
project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - "*.qmd"
    - "aulas/*.qmd"
    - "materiais/instrucoes-de-instalacao.qmd"
    - "materiais/exemplos/*.qmd"
    - "slides/aula-*.qmd"

lang: pt-BR

website:
  page-navigation: true
  title: "Relatórios reprodutíveis com R"
  site-url: "https://lemuelemos.github.io/2026-curso-de-verao-ime-usp-relatorios/"
  repo-url: "https://github.com/lemuelemos/2026-curso-de-verao-ime-usp-relatorios"
  repo-actions: [edit, issue]

  page-footer:
    right: "Site criado com [Quarto](https://quarto.org/)."
    left: "Conteúdo sob licença [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.pt-br)."
    background: "#17365D"

  sidebar:
    logo: "https://www.ime.usp.br/verao/assets/images/logo_verao.png"
    pinned: true
    background: "#17365D"
    align: center
    tools:
      - icon: github
        href: https://github.com/lemuelemos/2026-curso-de-verao-ime-usp-relatorios
        text: "Repositório do curso"

    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
      - href: https://cursosextensao.usp.br/enrol/index.php?id=4524
        text: "Plataforma USP"
      - section: "Sobre o curso"
        contents:
           - informacoes-gerais.qmd
           - profs.qmd
           - faq.qmd
      - section: "Materiais"
        contents:
           - materiais/instrucoes-de-instalacao.qmd
           - slides.qmd
           - text: "Exemplo: relatório parametrizado"
             href: materiais/exemplos/relatorio-parametrizado.qmd
      - section: "Aulas"
        contents:
          - aulas/aula-1.qmd
          - aulas/aula-2.qmd
          - aulas/aula-3.qmd
          - aulas/aula-4.qmd
          - aulas/aula-5.qmd
      - section: "Trabalho Final"
        contents: 
          - trabalho_final.qmd
      - section: "Edições anteriores"
        contents:
          - href: https://beatrizmilz.github.io/2022-curso-de-verao-ime-usp-relatorios/programacao-do-curso.html
            text: "Edição 2022"
          - href: https://beatrizmilz.github.io/2023-curso-de-verao-ime-usp-relatorios/informacoes-gerais.html
            text: "Edição 2023"
          - href: https://beatrizmilz.github.io/2024-curso-de-verao-ime-usp-relatorios/slides.html
            text: "Edição 2024"
          - href: "https://beatrizmilz.github.io/2025-curso-de-verao-ime-usp-relatorios/slides.html"
            text: "Edição 2025"
      - licenca.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    code-copy: true
    code-overflow: wrap
    toc: true
